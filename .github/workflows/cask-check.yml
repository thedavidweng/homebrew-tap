name: Cask checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cask-check:
    name: Cask checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true
      - name: Find changed casks
        id: changed
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" -- 'Casks/*.rb' > /tmp/cask-files
          cat /tmp/cask-files
      - name: Audit and style changed casks
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            token="${file#Casks/}"
            token="${token%.rb}"
            brew audit --cask --strict "thedavidweng/tap/$token"
            brew style "$file"
            if [[ "$HEAD_BRANCH" == bump-* ]]; then
              brew install --cask --appdir="$RUNNER_TEMP/cask-apps" "thedavidweng/tap/$token"
            fi
          done < /tmp/cask-files
