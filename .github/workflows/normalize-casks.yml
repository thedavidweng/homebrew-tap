name: Normalize Generated Casks

# GoReleaser pushes the casks it generates straight into this tap (see the
# `homebrew_casks` block in each CLI repo's .goreleaser.yaml), bypassing the
# workflows above. Its cask template still emits Homebrew's deprecated
# `preflight`/`postflight` stanzas (goreleaser/goreleaser#6873), so the source
# repos emit a `postflight_steps` block via `custom_block` instead — which
# GoReleaser renders at the top of the cask, out of stanza order.
#
# This workflow moves that block into place after each such push.

on:
  push:
    branches: [main]
    paths:
      - "Casks/*.rb"
      - "Formula/zenodo.rb"
  workflow_dispatch:

permissions: {}

concurrency:
  group: normalize-generated-casks
  cancel-in-progress: false

jobs:
  normalize:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run normaliser tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest tests.test_normalize_cask_style

      # Style must run on paths, not on `owner/tap/name`. This job never taps the
      # repository, and `brew style <owner>/<tap>/<name>` silently reports
      # "0 files inspected" when the tap is not tapped - a vacuous pass. Paths
      # make the gate real.
      #
      # The whole Casks directory is inspected, not a hand-picked list: a list
      # silently skips any cask added later, which is how canvas and flickr kept
      # broken completions and a too-long description without any gate noticing.
      - name: Autocorrect cask style
        run: brew style --fix Casks/

      - name: Normalise GoReleaser-generated casks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/normalize_cask_style.py

      - name: Check style
        run: brew style Casks/ Formula/zenodo.rb

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- Casks Formula/zenodo.rb)" ]; then
            echo "No cask changes to commit"
            exit 0
          fi

          git add Casks Formula/zenodo.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Normalize GoReleaser casks to current Homebrew stanza style'
          git push origin HEAD:main
