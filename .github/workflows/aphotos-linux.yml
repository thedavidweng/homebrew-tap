name: aphotos Linux cask

on:
  pull_request:
    paths:
      - Casks/aphotos.rb
      - .github/workflows/aphotos-linux.yml

permissions:
  contents: read

concurrency:
  group: aphotos-linux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
      - name: Install and test cask
        env:
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew trust thedavidweng/tap
          brew livecheck --cask thedavidweng/tap/aphotos --json | jq -e '.[0].version.latest != null'
          brew install --cask thedavidweng/tap/aphotos
          aphotos --version
          aphotos doctor --allow-unconfigured --json
          prefix="$(brew --prefix)"
          test -s "$prefix/etc/bash_completion.d/aphotos"
          test -s "$prefix/share/zsh/site-functions/_aphotos"
          test -s "$prefix/share/fish/vendor_completions.d/aphotos.fish"

  migration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            caskroom: present
          - os: macos-latest
            caskroom: present
          - os: ubuntu-latest
            caskroom: absent
          - os: ubuntu-latest
            caskroom: bad-checksum
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test formula-to-cask migration
        env:
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CASKROOM_STATE: ${{ matrix.caskroom }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          else
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          brew update
          source="$RUNNER_TEMP/aphotos-source"
          remote="$RUNNER_TEMP/aphotos-remote.git"
          mkdir -p "$source/Formula" "$source/Casks"
          cp Formula/aphotos.rb "$source/Formula/aphotos.rb"
          cp Casks/aphotos.rb "$source/Casks/aphotos.rb"
          if [[ "$CASKROOM_STATE" == bad-checksum ]]; then
            ruby -i -pe 'sub("153468a44608b4a78123753af965f70650b54b79fc76ea711743e40765bbc2b6", "0" * 64)' "$source/Casks/aphotos.rb"
            grep -F "$(printf '0%.0s' {1..64})" "$source/Casks/aphotos.rb"
          fi
          git -C "$source" init --initial-branch=main
          git -C "$source" config user.name thedavidweng
          id="$(gh api users/thedavidweng --jq .id)"
          printf -v email '%s+%s@%s' "$id" "$GITHUB_REPOSITORY_OWNER" 'users.noreply.github.com'
          git -C "$source" config user.email "$email"
          git -C "$source" add Formula/aphotos.rb Casks/aphotos.rb
          git -C "$source" commit -m 'Add formula and cask'
          git clone --bare "$source" "$remote"
          git -C "$source" remote add origin "$remote"
          brew tap test/aphotos-migration "$remote"
          brew trust test/aphotos-migration
          brew install --formula test/aphotos-migration/aphotos
          aphotos --version | grep -F '0.1.2'
          caskroom="$(brew --caskroom)"
          if [[ "$CASKROOM_STATE" != absent ]]; then
            mkdir -p "$caskroom"
          elif [[ -d "$caskroom" ]]; then
            rmdir "$caskroom"
          fi
          git -C "$source" rm Formula/aphotos.rb
          jq -n '{aphotos: "aphotos"}' > "$source/tap_migrations.json"
          git -C "$source" add tap_migrations.json
          git -C "$source" commit -m 'Migrate formula to cask'
          git -C "$source" push origin main
          if brew update 2>&1 | tee "$RUNNER_TEMP/migration-output.txt"; then
            :
          elif [[ "$CASKROOM_STATE" != bad-checksum ]]; then
            exit 1
          fi
          if [[ "$CASKROOM_STATE" == bad-checksum ]]; then
            grep -F 'reports different checksum' "$RUNNER_TEMP/migration-output.txt"
            test -x "$(brew --cellar)/aphotos/0.1.2/bin/aphotos"
            if ! aphotos --version | grep -F '0.1.2'; then
              echo 'failed cask installation left the existing aphotos command unavailable' >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$CASKROOM_STATE" == absent ]]; then
            grep -F 'To uninstall the formula and install the cask, run:' "$RUNNER_TEMP/migration-output.txt"
            aphotos --version | grep -F '0.1.2'
            brew uninstall --formula --force aphotos
            test ! -d "$(brew --cellar)/aphotos"
            brew install --cask test/aphotos-migration/aphotos
          fi
          brew list --cask test/aphotos-migration/aphotos
          aphotos --version | grep -F '0.1.5'
          prefix="$(brew --prefix)"
          test "$(command -v aphotos)" -ef "$(brew --caskroom)/aphotos/0.1.5/aphotos"
          test -s "$prefix/etc/bash_completion.d/aphotos"
          test -s "$prefix/share/zsh/site-functions/_aphotos"
          test -s "$prefix/share/fish/vendor_completions.d/aphotos.fish"
